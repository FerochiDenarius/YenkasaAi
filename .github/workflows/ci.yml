name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.dart')"
          else
            files="$(git diff --name-only "$base" "$GITHUB_SHA" -- '*.dart')"
          fi
          if [[ -n "$files" ]]; then
            xargs dart format --output=none --set-exit-if-changed <<< "$files"
          fi

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build production web bundle
        run: flutter build web --release --dart-define=YENKASA_ENV=production

  pytest:
    name: Backend pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .backend_work/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .backend_work/backend/requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q
